plugins {
    id 'com.android.application'
}

// The address of YOUR GitHub Pages calendar. Change it in ONE place only:
// the SITE_URL value in the GitHub "Variables" (see README), or edit the default below.
def siteUrl = (project.findProperty('siteUrl') ?: 'https://swagatgaikwad92-boop.github.io/Ghibli-Calander/').toString()
if (!siteUrl.endsWith('/')) siteUrl = siteUrl + '/'

// Each GitHub build gets a higher number, so a new APK always installs over the old one.
def buildNumber = ((project.findProperty('buildNumber') ?: '1').toString().isInteger()) ? project.findProperty('buildNumber').toString().toInteger() : 1

android {
    namespace 'com.ghibli.calendar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghibli.calendar'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName '1.' + buildNumber
        buildConfigField 'String', 'SITE_URL', '"' + siteUrl + '"'
    }

    buildFeatures { buildConfig true }

    // A fixed key means every new build can be installed OVER the old one
    // (your data is kept). Personal-use key, not for the Play Store.
    signingConfigs {
        fixed {
            storeFile file('ghibli-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug   { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
