name: Build Ghibli Calendar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GhibliCalendarAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK (licences + the two packages this project needs)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Unpack the Android project
        run: |
          mkdir -p work
          unzip -q GhibliCalendarAndroid.zip -d work
          test -f work/GhibliCalendarAndroid/settings.gradle

      - name: Build the APK
        working-directory: work/GhibliCalendarAndroid
        run: gradle assembleDebug --no-daemon -PsiteUrl="${{ vars.SITE_URL }}" -PbuildNumber="${{ github.run_number }}"

      - name: Check the APK is signed (prints the signing certificate)
        run: |
          APK=work/GhibliCalendarAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhibliCalendar-apk
          path: work/GhibliCalendarAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ghibli Calendar build ${{ github.run_number }}
          files: work/GhibliCalendarAndroid/app/build/outputs/apk/debug/app-debug.apk
